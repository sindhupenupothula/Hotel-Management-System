<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayora Hotels - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Login Stylesheet -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- Luxury Hotel Blurred Backdrop -->
    <div class="login-bg-backdrop"></div>
    <div class="login-bg-overlay"></div>

    <!-- Main Login Modal Card -->
    <div class="login-container">
        <!-- Left Side: Navy Blue Branding & Visuals -->
        <div class="login-left">
            <!-- Brand Top Header -->
            <div class="brand-header-section">
                <div class="brand-logo-ring">
                    <img src="images/logo.jpg" alt="Sayora Hotels Logo" class="brand-logo-img">
                </div>
                <div class="brand-tagline">STAY &bull; RELAX &bull; BELONG</div>
            </div>

            <!-- Brand Slogan -->
            <div class="brand-slogan-block">
                <h3>A better stay<br>for a brighter tomorrow</h3>
                <p>Comfort | Hospitality | Memorable Experiences</p>
            </div>

            <!-- Bottom Luxury Exterior Preview with Cursive Script -->
            <div class="brand-preview-wrapper">
                <img src="images/hotel-exterior-night.jpg" alt="Sayora Hotels Luxury Property" class="brand-preview-img">
                <div class="brand-preview-gradient">
                    <div class="welcome-cursive">
                        <span class="script-welcome">Welcome to</span>
                        <span class="script-brand">Sayora Hotels</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: White Clean Form -->
        <div class="login-right">
            <div class="login-header-group">
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>

            <form class="login-form" id="loginForm" onsubmit="handleLoginSubmit(event); return false;">
                <!-- Email / Username Field -->
                <div class="input-field-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    <input type="text" id="username" placeholder="Email Address" required autocomplete="username">
                </div>

                <!-- Password Field with Eye Toggle -->
                <div class="input-field-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Remember Me & Forgot Password Row -->
                <div class="login-options-row">
                    <label class="remember-me-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)" class="forgot-password-link" onclick="handleForgotPassword()">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login-submit" id="loginSubmitBtn">
                    <span>Login</span>
                    <span class="submit-arrow">&rarr;</span>
                </button>
            </form>

            <!-- OR Divider -->
            <div class="divider-separator">
                <span>OR</span>
            </div>

            <!-- Sign Up Section -->
            <div class="signup-section">
                <p>Don't have an account?</p>
                <a href="javascript:void(0)" class="signup-action-link" onclick="handleSignUpPrompt()">
                    Sign up for a new account &rarr;
                </a>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="loginToast" class="login-toast" role="alert">
        <span id="toastMessage">Notification message</span>
    </div>

    <!-- Application Script -->
    <script src="js/script.js"></script>

    <!-- Login Page Interactive Script -->
    <script>
        // Pre-fill remembered username if saved
        window.addEventListener("DOMContentLoaded", () => {
            const remembered = localStorage.getItem("sayoraRememberedUser");
            if (remembered) {
                const usernameEl = document.getElementById("username");
                if (usernameEl && !usernameEl.value) {
                    usernameEl.value = remembered;
                }
            }
        });

        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            if (!passwordInput || !eyeIcon) return;

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" y1="2" x2="22" y2="22"></line>
                `;
            } else {
                passwordInput.type = "password";
                eyeIcon.innerHTML = `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Show toast notification
        function showLoginToast(message, isSuccess = false) {
            const toast = document.getElementById("loginToast");
            const toastMsg = document.getElementById("toastMessage");
            if (!toast || !toastMsg) return;

            toastMsg.textContent = message;
            toast.className = "login-toast show" + (isSuccess ? " success" : "");

            setTimeout(() => {
                toast.className = "login-toast";
            }, 3500);
        }

        // Forgot password modal/alert
        function handleForgotPassword() {
            alert("Sayora Hotels Security Hint:\n\nDefault Admin Username: admin (or admin@sayora.com)\nDefault Password: " + (localStorage.getItem("sayoraAdminPassword") || "1234"));
        }

        // Sign up prompt
        function handleSignUpPrompt() {
            alert("Sayora Hotels Administrative Portal:\nNew account registration is managed by hotel administration. Please contact HR or IT administrator.");
        }

        // Enhanced login handler supporting both standard 'admin' and email variations
        function handleLoginSubmit(event) {
            if (event) event.preventDefault();

            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const rememberMe = document.getElementById("rememberMe");

            const enteredUser = usernameInput ? usernameInput.value.trim() : "";
            const enteredPass = passwordInput ? passwordInput.value : "";

            const storedPass = localStorage.getItem("sayoraAdminPassword") || "1234";

            // Allow 'admin' or emails like 'admin@sayora.com', 'admin@hotels.com', 'admin@gmail.com'
            const isUserValid = (
                enteredUser.toLowerCase() === "admin" ||
                enteredUser.toLowerCase() === "admin@sayora.com" ||
                enteredUser.toLowerCase() === "admin@gmail.com" ||
                enteredUser.toLowerCase().startsWith("admin@")
            );

            if (isUserValid && enteredPass === storedPass) {
                if (rememberMe && rememberMe.checked) {
                    localStorage.setItem("sayoraRememberedUser", enteredUser);
                } else {
                    localStorage.removeItem("sayoraRememberedUser");
                }
                showLoginToast("Login successful! Redirecting...", true);
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 600);
            } else {
                showLoginToast("Invalid Username / Email or Password");
            }
        }

        // Keep existing login() functional as fallback
        window.login = function() {
            handleLoginSubmit(null);
        };
    </script>
</body>

</html>
